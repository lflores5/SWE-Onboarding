# .github/workflows/ci.yml

name: CI Pipeline

# This workflow runs on every pull request to the 'main' branch
# and also on pushes to 'main' (for later CD, but also good for final checks)
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Job 1: Linting and Code Quality Checks
  lint_and_quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Flake8 (Linting)
        run: flake8 . --max-line-length=120 --exclude=.venv,swe_onboarding_tickets.egg-info --count --statistics

      - name: Run Bandit (Code Security)
        run: bandit -r app/ -ll -f json -o bandit_report.json || true

      - name: Run Black (Code Formatting Check)
        run: black --check app/ tests/

  # Job 2: Run Unit/Integration Tests
  run_tests:
    runs-on: ubuntu-latest
    needs: lint_and_quality # This job will only run if lint_and_quality passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest
        # Run tests with coverage reporting
        run: pytest tests/ -v --tb=short

  # Job 3: Build Docker Image
  build_docker_image:
    runs-on: ubuntu-latest
    needs: run_tests # This job will only run if run_tests passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t swe-tickets-microservice:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run --rm swe-tickets-microservice:${{ github.sha }} python --version
          echo "Docker image built successfully!"

      # Optional: Log in to Docker Hub (if pushing to a private registry later)
      # Uncomment these steps when you're ready to push to a container registry
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
