name: CI-CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint_and_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run Flake8 (Linting)
        run: flake8 . --max-line-length=120 --exclude=.venv,swe_onboarding_tickets.egg-info --count --statistics
      - name: Run Bandit (Code Security)
        run: bandit -r app/ -ll -f json -o bandit_report.json || true
      - name: Run Black (Code Formatting Check)
        run: black --check app/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint_and_quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest -q

  build_and_push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/swe-tickets-microservice:${{ github.sha }} .
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/swe-tickets-microservice:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/swe-tickets-microservice:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/swe-tickets-microservice:latest
      - name: Test Docker image
        run: |
          docker run --rm ${{ secrets.ACR_LOGIN_SERVER }}/swe-tickets-microservice:${{ github.sha }} python --version
          echo "Docker image built and pushed successfully!"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/swe-tickets-microservice:${{ github.sha }}
